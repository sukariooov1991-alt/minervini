name: Python verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: ":memory:"
      OUTPUT_PATH: "watchlist.json"
      MINERVINI_DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: |
          python -m compileall -q analysis data tests app.py screener.py gunicorn.conf.py
          python -m unittest discover -s tests -v
      - name: Import application modules
        run: |
          python - <<'PY'
          import app
          import screener
          import analysis
          from data.data_provider import DataProvider
          from data.storage_manager import StorageManager
          assert hasattr(DataProvider, "_fetch_alpha_vantage")
          assert hasattr(StorageManager, "replace_candles_bulk")
          assert hasattr(StorageManager, "get_scan_checkpoint")
          assert hasattr(StorageManager, "mark_scan_symbol_completed")
          assert hasattr(StorageManager, "has_scan_checkpoint")
          print("Application imports and provider/storage contracts passed.")
          PY
      - name: Verify storage and provider failover
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from datetime import datetime
          from unittest.mock import patch
          from zoneinfo import ZoneInfo
          from data.data_provider import DataProvider
          from data.storage_manager import StorageManager
          from analysis.relative_strength import relative_strength_score
          from analysis.trend_template import check_trend_template

          storage = StorageManager(":memory:")
          stable_now = datetime(2026, 11, 25, 18, 0, tzinfo=ZoneInfo("America/New_York"))
          dates = pd.bdate_range(end=pd.Timestamp("2026-11-25"), periods=300)
          close = np.linspace(10.0, 30.0, len(dates))
          frame = pd.DataFrame({
              "open": close,
              "high": close + 1.0,
              "low": close - 1.0,
              "close": close + 0.5,
              "volume": np.full(len(dates), 100000.0),
          }, index=dates)

          provider = DataProvider("AAPL", storage)
          attempted = []
          def fail(name):
              def _fetch(period):
                  attempted.append(name)
                  raise RuntimeError(name + " test failure")
              return _fetch
          provider._fetch_yahoo = fail("Yahoo Finance")
          provider._fetch_stooq = fail("Stooq")
          provider._fetch_nasdaq = fail("Nasdaq public data")
          def alpha_vantage_success(period):
              attempted.append("Alpha Vantage")
              return frame
          provider._fetch_alpha_vantage = alpha_vantage_success

          with patch("data.data_provider.MarketTime.now", return_value=stable_now):
              count = provider.fetch_and_store_daily_candles("2y")
          assert attempted == ["Yahoo Finance", "Stooq", "Nasdaq public data", "Alpha Vantage"], attempted
          assert count == 300, count
          assert provider.last_source == "Alpha Vantage", provider.last_source
          stored = storage.get_candles_df("AAPL")
          assert len(stored) == 300, len(stored)
          checkpoint_symbols = ["AAPL", "MSFT", "NVDA"]
          assert storage.get_scan_checkpoint("resume-test", checkpoint_symbols) == set()
          storage.mark_scan_symbol_completed("resume-test", "AAPL")
          resumed = storage.get_scan_checkpoint("resume-test", checkpoint_symbols)
          assert resumed == {"AAPL"}, resumed
          assert storage.has_scan_checkpoint("resume-test", checkpoint_symbols)
          assert not storage.has_scan_checkpoint("resume-test", ["AAPL", "MSFT"])
          storage.clear_scan_checkpoint("resume-test")
          assert not storage.has_scan_checkpoint("resume-test", checkpoint_symbols)
          assert np.isfinite(relative_strength_score(stored.set_index("date")["close"]))

          rating = 99
          trend = check_trend_template(stored.set_index("date"), rating)
          assert trend["passed"], trend
          print("Daily provider failover, 300-bar storage, RS and trend-template smoke checks passed.")
          PY
