<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minervini</title>
  <style>
    :root {
      --bg: #07090d;
      --card: #11161f;
      --card-border: #202938;
      --text: #eef2f7;
      --muted: #93a1b5;
      --entry: #3b82f6;
      --target: #22c55e;
      --stop: #ef4444;
      --btn-start: #1d4ed8;
      --btn-stop: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .topbar {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.06em;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }
    .market-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .market-badge {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      margin-bottom: 18px;
    }
    button {
      border: none;
      border-radius: 9px;
      min-width: 0;
      min-height: 44px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }
    .controls button { width: 100%; }
    .scan-progress {
      display: none;
      margin: -6px 0 18px;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }
    .scan-progress.visible { display: block; }
    .scan-errors { margin-top: 10px; color: #fca5a5; font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .scan-errors:empty { display: none; }
    .scan-progress-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; font-size: .88rem; }
    .progress-track { height: 10px; overflow: hidden; border-radius: 99px; background: #263244; }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit; background: var(--entry); transition: width .25s ease; }
    .scan-message { margin-top: 8px; color: var(--muted); font-size: .82rem; }
    .btn-scan { background: var(--btn-start); }
    .btn-stop { background: var(--btn-stop); }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card { background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:0; overflow:hidden; }
    .card-header {
      display: grid;
      grid-template-columns: minmax(88px,1fr) minmax(92px,.9fr) minmax(120px,1.35fr) 160px;
      align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer;
      border-bottom: 1px solid var(--card-border);
    }
    .symbol { display:block; font-size:clamp(1.15rem,4vw,1.65rem); font-weight:800; }
     .header-label { display:block; color:var(--muted); font-size:.76rem; font-weight:700; margin-bottom:3px; }
    .metric-footnote { display:block; margin-top:4px; color:var(--muted); font-size:.58rem; line-height:1.35; white-space:normal; overflow-wrap:anywhere; }
    .status-badge,.stage-badge { display:block; min-width:0; padding:7px 9px; border-radius:999px; text-align:center; font-size:.78rem; font-weight:700; line-height:1.25; }
    .status-badge { color:#fcd28b; background:#704516; }
    .status-badge.ready { color:#bbf7d0; background:#14532d; }
    .stage-badge { color:#dbeafe; background:#17477a; }
    .btn-del { width:32px; min-height:34px; padding:4px; color:#f87171; background:transparent; border:1px solid transparent; font-size:1.1rem; }
    .btn-del:hover { border-color:var(--stop); }
    .card-actions { display:flex; align-items:center; justify-content:flex-end; gap:7px; }
    .btn-smart { min-height:34px; padding:6px 10px; background:#17365f; border:1px solid #2d5b91; color:#dbeafe; font-size:.78rem; white-space:nowrap; }
    .btn-del { display:grid; place-items:center; width:34px; min-height:34px; padding:4px; color:#fca5a5; background:rgba(127,37,37,.12); border:1px solid rgba(239,68,68,.35); font-size:1rem; }
    .btn-smart { border-radius:8px; }
    .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; padding:10px 12px 0; }
    .metric { min-width:0; padding:9px 7px; border:1px solid var(--card-border); border-radius:9px; background:#0d131d; text-align:center; }
    .metric-label { display:block; color:var(--muted); font-size:.7rem; margin-bottom:4px; }
    .metric-value { display:block; color:var(--text); font-size:clamp(.85rem,3vw,1.08rem); font-weight:800; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .metric-price .metric-value { color:#93c5fd; }
    .metric-volume .metric-value { color:#86efac; }
    .metric-trades .metric-value { color:#fdba74; }
    .smart-reading-panel { margin:10px 12px 0; padding:11px; border:1px solid #29486b; border-radius:10px; background:rgba(23,54,95,.22); }
    .smart-reading-panel[hidden] { display:none; }
    .smart-reading-title { margin:0 0 7px; color:#bfdbfe; font-size:.88rem; }
    .smart-reading-text { color:var(--text); font-size:.82rem; line-height:1.7; white-space:pre-line; }
    .trade-plan { padding:10px 12px 12px; }
    .trade-plan-title { margin:0 0 8px; font-size:.9rem; font-weight:800; text-align:left; }
    .levels-table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; overflow:hidden; border:1px solid #344153; border-radius:12px; font-variant-numeric:tabular-nums; }
    .levels-table th,.levels-table td { padding:9px 6px; text-align:center; border-left:1px solid #344153; border-bottom:1px solid #344153; font-size:clamp(.78rem,2.8vw,1rem); }
    .levels-table th { color:#f1f5f9; font-weight:800; font-size:.82rem; }
    .levels-table tr:last-child td { border-bottom:0; }
    .levels-table th:last-child,.levels-table td:last-child { border-left:0; }
    .levels-table .row-index { width:34px; color:var(--muted); background:rgba(255,255,255,.025); }
    .levels-table .entry-head { background:#17365f; }
    .levels-table .target-head { background:#17603c; }
    .levels-table .entry-cell { color:#bfdbfe; }
    .levels-table .target-cell { color:#bbf7d0; }
    .levels-table tbody tr:nth-child(even) { background:rgba(255,255,255,.035); }
    .stop-loss-summary {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-top:8px; padding:9px 12px; border:1px solid rgba(239,68,68,.28);
      border-radius:9px; background:rgba(127,37,37,.12); color:#fecaca;
      font-size:.82rem; line-height:1.4;
    }
    .stop-loss-label { color:#fca5a5; font-weight:700; white-space:nowrap; }
    .stop-loss-value { min-width:0; text-align:left; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    @media(max-width:520px) {
      .container { padding:9px; }
      .card-header {
        position:relative; grid-template-columns:minmax(0,1fr) auto;
        grid-template-areas:"symbol actions" "status stage";
        gap:8px 9px; padding:10px 10px;
      }
      .symbol { grid-area:symbol; font-size:1.08rem; }
      .card-actions { grid-area:actions; }
      .status-wrap { grid-area:status; min-width:0; }
      .stage-wrap { grid-area:stage; min-width:0; }
      .header-label { font-size:.64rem; margin-bottom:2px; }
      .metric-footnote { font-size:.54rem; }
      .status-badge,.stage-badge { display:block; width:100%; padding:5px 7px; font-size:.68rem; line-height:1.35; white-space:normal; overflow-wrap:anywhere; }
      .card-actions { gap:4px; }
      .btn-smart { min-height:30px; padding:5px 7px; font-size:.68rem; }
      .btn-del { width:28px; min-height:30px; font-size:.9rem; }
      .metrics { gap:5px; padding:8px 8px 0; }
      .metric { padding:7px 4px; }
      .metric-label { font-size:.61rem; }
      .metric-value { font-size:.82rem; }
      .smart-reading-panel { margin:8px 8px 0; padding:9px; }
      .smart-reading-text { font-size:.75rem; }
      .trade-plan { padding:8px 8px 10px; }
      .trade-plan-title { margin-bottom:7px; font-size:.82rem; }
      .levels-table th,.levels-table td { padding:7px 5px; font-size:.76rem; line-height:1.25; }
      .levels-table th { font-size:.72rem; }
      .levels-table .row-index { width:26px; }
      .stop-loss-summary { margin-top:7px; padding:7px 9px; font-size:.72rem; }
    }
    @media(max-width:360px) {
      .card-header { gap:6px 7px; padding:9px 8px; }
      .symbol { font-size:1rem; }
      .status-badge,.stage-badge { font-size:.64rem; }
      .levels-table th,.levels-table td { font-size:.7rem; padding:6px 3px; }
      .stop-loss-summary { font-size:.68rem; }
    }
    .expanded {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      display: none;
    }
    .card.is-open .expanded { display: block; }
    .section-title {
      font-weight: 700;
      margin: 10px 0 6px;
      font-size: 0.95rem;
    }
    .filter-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
  </style>
</head>
<body>
  <div class="topbar">minervini</div>
  <div class="container">
    <div class="market-bar">
      <div class="market-badge" id="marketSession">حالة السوق: قبل الافتتاح</div>
    </div>
    <div class="controls">
      <button class="btn-scan" id="startBtn" onclick="startScan()">فحص</button>
      <button class="btn-stop" id="stopBtn" onclick="stopScan()">إيقاف الفحص</button>
    </div>
    <section class="scan-progress" id="marketProgress" aria-live="polite">
      <div class="scan-progress-top">
        <strong>المرحلة الأولى: فحص السوق وجلب البيانات</strong>
        <strong id="marketPercent">0%</strong>
      </div>
      <div class="progress-track" role="progressbar" aria-label="تقدم فحص السوق وجلب البيانات" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="marketProgressTrack">
        <div class="progress-fill" id="marketProgressFill"></div>
      </div>
      <div class="scan-message" id="marketDetails">بانتظار بدء فحص السوق...</div>
    </section>
    <section class="scan-progress" id="candidateProgress" aria-live="polite">
      <div class="scan-progress-top">
        <strong>المرحلة الثانية: تحليل الأسهم المرشحة</strong>
        <strong id="candidatePercent">0%</strong>
      </div>
      <div class="progress-track" role="progressbar" aria-label="تقدم تحليل الأسهم المرشحة" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="candidateProgressTrack">
        <div class="progress-fill" id="candidateProgressFill"></div>
      </div>
      <div class="scan-message" id="candidateDetails">بانتظار اكتمال المرحلة الأولى...</div>
      <div class="scan-errors" id="scanErrors" aria-live="polite"></div>
    </section>
    <div class="cards" id="cardsContainer"></div>
  </div>

  <script>
    const openCards = new Set();
    // /api/state and SSE can arrive out of order; never let an older snapshot
    // overwrite a newer watchlist snapshot and make visible cards disappear.
    let lastAppliedSnapshotVersion = -1;
    let lastSnapshotInstanceId = null;
    let lastRenderedCardCount = 0;
    let scanProgressHideTimer = null;
    let scanProgressDismissedPhase = null;

    async function startScan() {
      if (scanProgressHideTimer) clearTimeout(scanProgressHideTimer);
      scanProgressHideTimer = null;
      scanProgressDismissedPhase = null;
      for (const id of ['marketProgress', 'candidateProgress']) {
        document.getElementById(id).classList.add('visible');
      }
      for (const prefix of ['market', 'candidate']) {
        document.getElementById(prefix + 'ProgressFill').style.width = '0%';
        document.getElementById(prefix + 'Percent').textContent = '0%';
        document.getElementById(prefix + 'ProgressTrack').setAttribute('aria-valuenow', '0');
      }
      document.getElementById('marketDetails').textContent = 'جارٍ تجهيز فحص السوق والبيانات...';
      document.getElementById('candidateDetails').textContent = 'بانتظار اكتمال المرحلة الأولى...';
      document.getElementById('scanErrors').textContent = '';
      try {
        const response = await fetch('/api/scan/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (!result.started) message.textContent = 'يوجد فحص جارٍ بالفعل';
      } catch (e) {
        console.error('[MINERVINI] Start scan failed', e);
        message.textContent = 'تعذر بدء الفحص: ' + e.message;
      }
    }

    async function stopScan() {
      try {
        await fetch('/api/scan/stop', { method: 'POST' });
        document.getElementById('scanMessage').textContent = 'جارٍ إيقاف الفحص...';
      } catch (e) {
        console.error('[MINERVINI] Stop scan failed', e);
      }
    }

    function renderOneStageProgress(data, stage, prefix) {
      const progressMap = data.scan_progress_by_stage || {};
      const p = progressMap[stage] || ((data.scan_progress || {}).stage === stage ? data.scan_progress : {});
      const box = document.getElementById(prefix + 'Progress');
      const active = Boolean(data.running || (p.phase && p.phase !== 'idle'));
      box.classList.toggle('visible', active);
      if (!active) return;

      const percent = Math.max(0, Math.min(100, Number(p.percent) || 0));
      document.getElementById(prefix + 'ProgressFill').style.width = percent + '%';
      document.getElementById(prefix + 'Percent').textContent = percent + '%';
      document.getElementById(prefix + 'ProgressTrack').setAttribute('aria-valuenow', String(percent));

      const total = Number(p.total) || 0;
      const completed = Number(p.completed) || 0;
      let details = completed + '/' + total;
      if (p.batch) details += ' — الدفعة ' + p.batch;
      if (p.batch_total) details += ' — إجمالي الدفعات: ' + p.batch_total;
      if (p.current_symbol) details += ' — السهم: ' + p.current_symbol;
      if (p.error) details += '\\nخطأ: ' + p.error;
      if (stage === 'market_data' && percent >= 100) details = 'اكتمل فحص السوق وجلب البيانات — ' + details;
      if (stage === 'candidate_analysis' && percent >= 100) details = 'اكتمل تحليل الأسهم المرشحة — ' + details;
      document.getElementById(prefix + 'Details').textContent = details;
    }

    function renderMarketProgress(data) {
      renderOneStageProgress(data, 'market_data', 'market');
    }

    function renderCandidateProgress(data) {
      renderOneStageProgress(data, 'candidate_analysis', 'candidate');
      const errors = Array.isArray(data.scan_errors) ? data.scan_errors : [];
      document.getElementById('scanErrors').textContent =
        errors.slice(-5).map(e => e.symbol + ' [' + e.phase + ']: ' + e.message).join('\\n');
    }

    function renderScanProgress(data) {
      renderMarketProgress(data);
      renderCandidateProgress(data);
      const p = data.scan_progress || {};
      const terminal = ['completed', 'stopped', 'error'].includes(p.phase);
      if (!terminal) {
        if (scanProgressHideTimer) clearTimeout(scanProgressHideTimer);
        scanProgressHideTimer = null;
        scanProgressDismissedPhase = null;
        return;
      }
      if (!scanProgressHideTimer) {
        scanProgressHideTimer = setTimeout(() => {
          document.getElementById('marketProgress').classList.remove('visible');
          document.getElementById('candidateProgress').classList.remove('visible');
          scanProgressHideTimer = null;
        }, 2500);
      }
    }

    async function deleteCard(event, sym) {
      event.stopPropagation();
      if (!window.confirm('هل تريد حذف هذا السهم من قائمة المراقبة؟')) return;
      try {
        const response = await fetch(`/api/cards/${encodeURIComponent(sym)}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        openCards.delete(sym);
        const card = document.querySelector(`[data-symbol="${CSS.escape(sym)}"]`);
        if (card) card.remove();
        lastRenderedCardCount = document.getElementById('cardsContainer').children.length;
      } catch (error) {
        console.error('[MINERVINI] Card deletion failed', error);
        window.alert('تعذر حذف السهم. حاول مرة أخرى.');
      }
    }

    function toggleCard(sym) {
      if (openCards.has(sym)) {
        openCards.delete(sym);
      } else {
        openCards.add(sym);
      }
      const el = document.querySelector(`[data-symbol="${CSS.escape(sym)}"]`);
      if (el) { el.classList.toggle('is-open', openCards.has(sym)); el.querySelector('.card-header').setAttribute('aria-expanded', String(openCards.has(sym))); }
    }

    function setTextIfChanged(element, value) {
      const next = value == null ? '' : String(value);
      if (element.textContent !== next) element.textContent = next;
    }

    function ensureCardElement(container, sym) {
      let el = container.querySelector(`[data-symbol="${CSS.escape(sym)}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'card';
        el.dataset.symbol = sym;
        el.innerHTML = `
          <div class="card-header" role="button" tabindex="0" aria-expanded="false">
            <div class="symbol"></div>
            <div class="status-wrap"><span class="header-label">الحالة</span><span class="status-badge"></span></div>
            <div class="stage-wrap"><span class="header-label">المرحلة</span><span class="stage-badge"></span></div>
            <div class="card-actions">
              <button class="btn-smart" type="button" aria-expanded="false">القراءة الذكية</button>
              <button class="btn-del" type="button" aria-label="حذف السهم من قائمة المراقبة" title="حذف السهم">🗑</button>
            </div>
          </div>
          <div class="metrics" aria-label="بيانات التداول اللحظية">
            <div class="metric metric-price"><span class="metric-label">السعر اللحظي</span><strong class="metric-value live-price-value">—</strong><span class="metric-footnote price-sub"></span></div>
            <div class="metric metric-volume"><span class="metric-label">حجم التداول</span><strong class="metric-value live-volume-value">—</strong></div>
            <div class="metric metric-trades"><span class="metric-label">الصفقات المرصودة</span><strong class="metric-value live-trades-value">—</strong><span class="metric-footnote">تنفيذات واردة من لونجبريدج، وليست الإجمالي اليومي</span></div>
          </div>
          <section class="smart-reading-panel" hidden>
            <h3 class="smart-reading-title">القراءة الذكية للسهم</h3>
            <div class="smart-reading-text"></div>
          </section>
          <div class="trade-plan">
            <h3 class="trade-plan-title">خطة التداول</h3>
            <table class="levels-table" aria-label="خطة التداول">
              <thead><tr><th class="row-index">#</th><th class="entry-head">الدخول</th><th class="target-head">الأهداف</th></tr></thead>
              <tbody class="levels-rows"></tbody>
            </table>
            <div class="stop-loss-summary"><span class="stop-loss-label">وقف الخسارة</span><strong class="stop-loss-value">—</strong></div>
          </div>
          <div class="expanded">
            <div class="section-title">تفاصيل شروط الاستراتيجية</div>
            <div class="filters-list"></div>
          </div>
        `;
        el.addEventListener('click', (event) => { if (!event.target.closest('.btn-del')) toggleCard(sym); });
        el.querySelector('.card-header').addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleCard(sym); }
        });
        el.querySelector('.btn-del').addEventListener('click', (e) => deleteCard(e, sym));
        el.querySelector('.btn-smart').addEventListener('click', (event) => {
          event.stopPropagation();
          const panel = el.querySelector('.smart-reading-panel');
          const button = event.currentTarget;
          const willOpen = panel.hidden;
          panel.hidden = !willOpen;
          button.setAttribute('aria-expanded', String(willOpen));
          if (willOpen) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        container.appendChild(el);
      }
      return el;
    }

    function renderCards(cards) {
      const container = document.getElementById('cardsContainer');
      for (const c of cards) {
        const el = ensureCardElement(container, c.symbol);
        el.classList.toggle('is-open', openCards.has(c.symbol));
        el.querySelector('.card-header').setAttribute('aria-expanded', String(openCards.has(c.symbol)));

        setTextIfChanged(el.querySelector('.symbol'), c.symbol);
        const parseQuoteDate = (value) => {
          if (value === null || value === undefined || value === '') return null;
          const raw = String(value);
          const parsed = new Date((typeof value === 'number' || /^\d+(\.\d+)?$/.test(raw)) ? Number(value) * 1000 : value);
          return Number.isNaN(parsed.getTime()) ? null : parsed;
        };
        const quoteDate = parseQuoteDate(c.price_timestamp);
        const receivedDate = parseQuoteDate(c.price_received_at);
        const priceUpdated = quoteDate
          ? quoteDate.toLocaleString('ar-SA', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' })
          : (receivedDate ? receivedDate.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '');
        const receivedUpdated = quoteDate && receivedDate
          ? receivedDate.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
          : '';
        // Provider time is preferred; when the feed omits it, server receipt
        // time still gives a reliable age for the last observed live price.
        const freshnessDate = quoteDate || receivedDate;
        const quoteAgeSeconds = freshnessDate
          ? Math.max(0, (Date.now() - freshnessDate.getTime()) / 1000)
          : null;
        const freshnessLimit = c.price_session === 'regular' ? 300 : 900;
        const isStaleQuote = quoteAgeSeconds !== null && quoteAgeSeconds > freshnessLimit;
        setTextIfChanged(el.querySelector('.live-price-value'), c.current_price == null ? '—' : c.current_price);
        const volumeValue = c.trading_volume;
        const formattedVolume = volumeValue == null ? '—' : new Intl.NumberFormat('ar-SA', { notation:'compact', maximumFractionDigits:2 }).format(Number(volumeValue));
        setTextIfChanged(el.querySelector('.live-volume-value'), formattedVolume);
        setTextIfChanged(el.querySelector('.live-trades-value'), c.trade_count == null ? '—' : new Intl.NumberFormat('ar-SA').format(Number(c.trade_count)));
        const isLivePrice = c.price_source === 'Longbridge WebSocket';
        const sourceLabel = isLivePrice
          ? (isStaleQuote ? 'آخر سعر قديم من لونجبريدج' : 'آخر سعر من لونجبريدج')
          : 'إغلاق يومي محفوظ';
        const sessionLabels = {
          regular: 'الجلسة الرئيسية',
          'pre-market': 'ما قبل الافتتاح',
          'post-market': 'ما بعد الإغلاق',
          overnight: 'التداول الليلي'
        };
        const sessionLabel = sessionLabels[c.price_session] || '';
        const tagLabel = Number(c.price_tag) === 1 ? 'بيانات مصححة بعد الإغلاق' : '';
        setTextIfChanged(el.querySelector('.price-sub'), [
          sourceLabel,
          isLivePrice ? sessionLabel : '',
          priceUpdated ? (quoteDate ? 'وقت السعر ' : 'وقت الاستلام ') + priceUpdated : '',
          receivedUpdated ? 'وصل ' + receivedUpdated : '',
          tagLabel
        ].filter(Boolean).join(' • '));
        const status = el.querySelector('.status-badge');
        setTextIfChanged(status, c.current_eligibility === 'FAIL' ? 'غير مؤهل حالياً' : (c.entry_ready ? 'جاهز للدخول' : (c.setup_passed && !c.entry_confirmation_passed ? 'بانتظار التأكيد' : (c.setup_passed && !c.market_favorable ? 'السوق غير ملائم' : 'مراقبة'))));
        status.classList.toggle('ready', Boolean(c.entry_ready));
        const stageLabel = String(c.stage || 'تجميع بانتظار النموذج')
          .replace(/\bVCP\b/g, 'انكماش التذبذب')
          .replace(/\bPullback\b/g, 'التراجع السعري');
        setTextIfChanged(el.querySelector('.stage-badge'), stageLabel.replace(/^المرحلة\s*\d+\s*:\s*/, ''));
        const entries = Array.isArray(c.entry_zones) ? c.entry_zones : [];
        const targets = Array.isArray(c.targets) ? c.targets : [];
        const rows = el.querySelector('.levels-rows');
        const levelsSignature = JSON.stringify([
          entries, targets, c.shared_stop_loss, c.stop_source, c.levels_status
        ]);
        if (rows.dataset.signature !== levelsSignature) {
          const fragment = document.createDocumentFragment();
          for (let i = 0; i < 5; i++) {
            const tr = document.createElement('tr');
            const index = document.createElement('td'); index.className = 'row-index'; index.textContent = String(i + 1);
            const entry = document.createElement('td'); entry.className = 'entry-cell'; entry.textContent = entries[i] == null ? '—' : String(entries[i]);
            const target = document.createElement('td'); target.className = 'target-cell'; target.textContent = targets[i] == null ? '—' : String(targets[i]);
            tr.append(index, entry, target);
            fragment.appendChild(tr);
          }
          rows.replaceChildren(fragment);
          rows.dataset.signature = levelsSignature;
        }
        const stopValue = el.querySelector('.stop-loss-value');
        setTextIfChanged(stopValue, c.shared_stop_loss == null ? (c.levels_status || 'غير متوفر') : String(c.shared_stop_loss) + (c.stop_source === 'atr' ? ' • وقف حسب متوسط المدى الحقيقي' : c.stop_source === 'structural' ? ' • وقف أسفل القاع الهيكلي' : ''));
        setTextIfChanged(el.querySelector('.smart-reading-text'), c.smart_reading || 'لا تتوفر قراءة ذكية حالياً.');

        const filtersNode = el.querySelector('.filters-list');
        const filters = Array.isArray(c.filters) ? c.filters : [];
        const filtersSignature = JSON.stringify(filters.map(f => [
          f && f.name != null ? String(f.name) : '',
          f && f.pending ? 'بانتظار النموذج' : (f && f.passed ? 'ناجح' : 'غير ناجح')
        ]));
        if (filtersNode.dataset.signature !== filtersSignature) {
          const fragment = document.createDocumentFragment();
          for (const f of filters) {
            const row = document.createElement('div');
            row.className = 'filter-row';
            const name = document.createElement('span');
            const filterNameTranslations = {
              'VCP Pattern': 'نموذج انكماش التذبذب',
              'VCP Breakout Confirmation': 'تأكيد اختراق نقطة الارتكاز',
              'Pullback Setup': 'نموذج التراجع السعري',
              'Pullback Entry Confirmation': 'تأكيد انعطاف السعر للأعلى',
              'Accumulation': 'التجميع',
              'Earnings Growth': 'نمو الأرباح والمبيعات',
              'Market Regime Favorable': 'ملاءمة حالة السوق',
              'Trend Template — price_above_150_and_200': 'السعر أعلى من متوسطي 150 و200 يوم',
              'Trend Template — sma150_above_sma200': 'متوسط 150 يوم أعلى من متوسط 200 يوم',
              'Trend Template — sma200_rising_for_at_least_one_month': 'متوسط 200 يوم صاعد منذ شهر على الأقل',
              'Trend Template — sma50_above_150_and_200': 'متوسط 50 يوم أعلى من متوسطي 150 و200 يوم',
              'Trend Template — price_above_sma50': 'السعر أعلى من متوسط 50 يوم',
              'Trend Template — price_at_least_30_percent_above_52w_low': 'السعر أعلى من أدنى 52 أسبوعاً بنسبة 30% على الأقل',
              'Trend Template — price_within_25_percent_of_52w_high': 'السعر ضمن 25% من أعلى 52 أسبوعاً',
              'Trend Template — relative_strength_rating_at_least_70': 'القوة النسبية 70 أو أعلى'
            };
            const rawFilterName = f && f.name != null ? String(f.name) : '';
            name.textContent = filterNameTranslations[rawFilterName] || rawFilterName;
            const status = document.createElement('span');
            status.textContent = f && f.pending ? 'بانتظار النموذج' : (f && f.passed ? 'ناجح' : 'غير ناجح');
            row.append(name, status);
            fragment.appendChild(row);
          }
          filtersNode.replaceChildren(fragment);
          filtersNode.dataset.signature = filtersSignature;
        }
      }

      // Missing cards in a partial or stale snapshot are not deletion commands.
      // A card leaves this page only after the user confirms manual deletion.
      lastRenderedCardCount = container.children.length;
    }

    function applySnapshot(data) {
      if (!data || typeof data !== 'object' || !Number.isFinite(Number(data.version))) {
        console.warn('[MINERVINI] Ignored invalid state snapshot', data);
        return;
      }
      const snapshotVersion = Number(data.version);
      const incomingInstanceId = String(data.instance_id || '');
      if (incomingInstanceId && lastSnapshotInstanceId && incomingInstanceId !== lastSnapshotInstanceId) {
        console.info('[MINERVINI] Server instance changed; resetting snapshot cursor', {
          previous: lastSnapshotInstanceId, current: incomingInstanceId
        });
        lastAppliedSnapshotVersion = -1;
      }
      if (incomingInstanceId) lastSnapshotInstanceId = incomingInstanceId;
      if (snapshotVersion < lastAppliedSnapshotVersion) {
        console.debug('[MINERVINI] Ignored stale state snapshot', {
          received: snapshotVersion, latest: lastAppliedSnapshotVersion
        });
        return;
      }

      const sessionEl = document.getElementById('marketSession');
      if (data.last_error) {
        sessionEl.textContent = `خطأ: ${data.last_error}`;
      } else {
        sessionEl.textContent = `حالة السوق: ${data.market_session || 'قبل الافتتاح'}`;
      }

      // Render progress on every snapshot, including SSE heartbeats.
      // This keeps the progress panel responsive if an event repeats a version.
      renderScanProgress(data);
      // Equal-version snapshots are still rendered: SSE and polling may
      // deliver the same state through different paths, and the card renderer
      // updates existing DOM nodes in place without rebuilding or flicker.
      if (snapshotVersion > lastAppliedSnapshotVersion) {
        lastAppliedSnapshotVersion = snapshotVersion;
      }

      // A missing cards field is an incomplete payload, not an instruction to
      // erase the watchlist. An explicit empty array remains authoritative.
      if (!Array.isArray(data.cards)) {
        console.warn('[MINERVINI] Snapshot omitted cards; preserving rendered watchlist', snapshotVersion);
        return;
      }
      if (lastRenderedCardCount > 0 && data.cards.length === 0) {
        console.warn('[MINERVINI] Server sent an unexpected empty watchlist snapshot; preserving existing cards', {
          version: snapshotVersion, running: data.running,
          scanProgress: data.scan_progress
        });
        return;
      }
      renderCards(data.cards);
      lastRenderedCardCount = document.getElementById('cardsContainer').children.length;
    }

    function connectRealtimeStream() {
      const evtSource = new EventSource('/api/stream');
      evtSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          applySnapshot(data);
        } catch (e) {
          console.error('[MINERVINI] SSE message parse failed', e);
        }
      };
      evtSource.onerror = (e) => {
        console.error('[MINERVINI] SSE connection error', e);
        evtSource.close();
        // The server's in-memory snapshot version restarts from zero after a
        // Render/Gunicorn restart. Reset the client cursor before reconnecting,
        // otherwise every fresh snapshot can be rejected as "older" forever.
        lastAppliedSnapshotVersion = -1;
        setTimeout(connectRealtimeStream, 2000);
      };
    }

    async function refreshStateSnapshot() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        applySnapshot(await response.json());
      } catch (error) {
        console.warn('[MINERVINI] State polling failed; SSE remains active', error);
      }
    }

    // SSE is the low-latency path; polling recovers updates if a mobile
    // browser or proxy suspends/buffers the EventSource connection.
    refreshStateSnapshot();
    setInterval(refreshStateSnapshot, 3000);
    connectRealtimeStream();
  </script>
</body>
</html>
