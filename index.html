<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minervini</title>
  <style>
    :root {
      --bg: #07090d;
      --card: #11161f;
      --card-border: #202938;
      --text: #eef2f7;
      --muted: #93a1b5;
      --entry: #3b82f6;
      --target: #22c55e;
      --stop: #ef4444;
      --btn-start: #1d4ed8;
      --btn-stop: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .topbar {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.06em;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }
    .market-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .market-badge {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      margin-bottom: 18px;
    }
    button {
      border: none;
      border-radius: 9px;
      min-width: 0;
      min-height: 44px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }
    .controls button { width: 100%; }
    .scan-progress {
      display: none;
      margin: -6px 0 18px;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }
    .scan-progress.visible { display: block; }
    .scan-errors { margin-top: 10px; color: #fca5a5; font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .scan-errors:empty { display: none; }
    .scan-progress-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; font-size: .88rem; }
    .progress-track { height: 10px; overflow: hidden; border-radius: 99px; background: #263244; }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit; background: var(--entry); transition: width .25s ease; }
    .scan-message { margin-top: 8px; color: var(--muted); font-size: .82rem; }
    .btn-scan { background: var(--btn-start); }
    .btn-stop { background: var(--btn-stop); }
    .btn-del {
      background: transparent;
      color: var(--stop);
      border: 1px solid var(--stop);
      padding: 4px 10px;
      font-size: 0.8rem;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card { background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:0; overflow:hidden; }
    .card-header {
      display: grid;
      grid-template-columns: minmax(88px,1.05fr) minmax(78px,.8fr) minmax(92px,.9fr) minmax(120px,1.35fr) 34px;
      align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer;
      border-bottom: 1px solid var(--card-border);
    }
    .symbol { display:block; font-size:clamp(1.15rem,4vw,1.65rem); font-weight:800; }
    .price-block { min-width:0; text-align:center; }
    .price-label,.header-label { display:block; color:var(--muted); font-size:.76rem; font-weight:700; margin-bottom:3px; }
    .price-text { display:block; color:var(--text); font-size:1.12rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .price-sub { display:block; color:var(--muted); font-size:.65rem; white-space:nowrap; }
    .status-badge,.stage-badge { display:block; min-width:0; padding:7px 9px; border-radius:999px; text-align:center; font-size:.78rem; font-weight:700; line-height:1.25; }
    .status-badge { color:#fcd28b; background:#704516; }
    .status-badge.ready { color:#bbf7d0; background:#14532d; }
    .stage-badge { color:#dbeafe; background:#17477a; }
    .btn-del { width:32px; min-height:34px; padding:4px; color:#f87171; background:transparent; border:1px solid transparent; font-size:1.1rem; }
    .btn-del:hover { border-color:var(--stop); }
    .trade-plan { padding:10px 12px 12px; }
    .trade-plan-title { margin:0 0 8px; font-size:.9rem; font-weight:800; text-align:left; }
    .levels-table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; overflow:hidden; border:1px solid #344153; border-radius:12px; font-variant-numeric:tabular-nums; }
    .levels-table th,.levels-table td { padding:9px 6px; text-align:center; border-left:1px solid #344153; border-bottom:1px solid #344153; font-size:clamp(.78rem,2.8vw,1rem); }
    .levels-table th { color:#f1f5f9; font-weight:800; font-size:.82rem; }
    .levels-table tr:last-child td { border-bottom:0; }
    .levels-table th:last-child,.levels-table td:last-child { border-left:0; }
    .levels-table .row-index { width:34px; color:var(--muted); background:rgba(255,255,255,.025); }
    .levels-table .entry-head { background:#17365f; }
    .levels-table .target-head { background:#17603c; }
    .levels-table .entry-cell { color:#bfdbfe; }
    .levels-table .target-cell { color:#bbf7d0; }
    .levels-table tbody tr:nth-child(even) { background:rgba(255,255,255,.035); }
    .stop-loss-summary {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-top:8px; padding:9px 12px; border:1px solid rgba(239,68,68,.28);
      border-radius:9px; background:rgba(127,37,37,.12); color:#fecaca;
      font-size:.82rem; line-height:1.4;
    }
    .stop-loss-label { color:#fca5a5; font-weight:700; white-space:nowrap; }
    .stop-loss-value { min-width:0; text-align:left; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    @media(max-width:520px) {
      .container { padding:9px; }
      .card-header {
        position:relative; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;
        grid-template-areas:"symbol price delete" "status stage stage";
        gap:8px 9px; padding:10px 10px;
      }
      .symbol { grid-area:symbol; font-size:1.08rem; }
      .price-block { grid-area:price; text-align:center; }
      .status-wrap { grid-area:status; min-width:0; }
      .stage-wrap { grid-area:stage; min-width:0; }
      .btn-del { grid-area:delete; width:27px; min-height:30px; font-size:.9rem; align-self:start; }
      .price-text { font-size:.94rem; }
      .price-label,.header-label { font-size:.64rem; margin-bottom:2px; }
      .price-sub { font-size:.58rem; white-space:normal; }
      .status-badge,.stage-badge { display:block; width:100%; padding:5px 7px; font-size:.68rem; line-height:1.35; white-space:normal; overflow-wrap:anywhere; }
      .trade-plan { padding:8px 8px 10px; }
      .trade-plan-title { margin-bottom:7px; font-size:.82rem; }
      .levels-table th,.levels-table td { padding:7px 5px; font-size:.76rem; line-height:1.25; }
      .levels-table th { font-size:.72rem; }
      .levels-table .row-index { width:26px; }
      .stop-loss-summary { margin-top:7px; padding:7px 9px; font-size:.72rem; }
    }
    @media(max-width:360px) {
      .card-header { gap:6px 7px; padding:9px 8px; }
      .symbol { font-size:1rem; }
      .price-text { font-size:.88rem; }
      .status-badge,.stage-badge { font-size:.64rem; }
      .levels-table th,.levels-table td { font-size:.7rem; padding:6px 3px; }
      .stop-loss-summary { font-size:.68rem; }
    }
    .expanded {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      display: none;
    }
    .card.is-open .expanded { display: block; }
    .section-title {
      font-weight: 700;
      margin: 10px 0 6px;
      font-size: 0.95rem;
    }
    .filter-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
  </style>
</head>
<body>
  <div class="topbar">minervini</div>
  <div class="container">
    <div class="market-bar">
      <div class="market-badge" id="marketSession">حالة السوق: قبل الافتتاح</div>
    </div>
    <div class="controls">
      <button class="btn-scan" id="startBtn" onclick="startScan()">فحص</button>
      <button class="btn-stop" id="stopBtn" onclick="stopScan()">إيقاف الفحص</button>
    </div>
    <section class="scan-progress" id="scanProgress" aria-live="polite">
      <div class="scan-progress-top">
        <strong id="scanMessage">الفحص قيد التجهيز</strong>
        <strong id="scanPercent">0%</strong>
      </div>
      <div class="progress-track" role="progressbar" aria-label="تقدم الفحص" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="scanProgressTrack">
        <div class="progress-fill" id="scanProgressFill"></div>
      </div>
      <div class="scan-message" id="scanDetails">اضغط «فحص» لبدء فحص الأسهم على دفعات من خمسة.</div>
      <div class="scan-errors" id="scanErrors" aria-live="polite"></div>
    </section>
    <div class="cards" id="cardsContainer"></div>
  </div>

  <script>
    const openCards = new Set();
    // /api/state and SSE can arrive out of order; never let an older snapshot
    // overwrite a newer watchlist snapshot and make visible cards disappear.
    let lastAppliedSnapshotVersion = -1;
    let lastRenderedCardCount = 0;

    async function startScan() {
      const message = document.getElementById('scanMessage');
      message.textContent = 'بدأ الفحص...';
      document.getElementById('scanProgress').classList.add('visible');
      document.getElementById('scanProgressFill').style.width = '0%';
      document.getElementById('scanPercent').textContent = '0%';
      try {
        const response = await fetch('/api/scan/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (!result.started) message.textContent = 'يوجد فحص جارٍ بالفعل';
      } catch (e) {
        console.error('[MINERVINI] Start scan failed', e);
        message.textContent = 'تعذر بدء الفحص: ' + e.message;
      }
    }

    async function stopScan() {
      try {
        await fetch('/api/scan/stop', { method: 'POST' });
        document.getElementById('scanMessage').textContent = 'جارٍ إيقاف الفحص...';
      } catch (e) {
        console.error('[MINERVINI] Stop scan failed', e);
      }
    }

    function renderScanProgress(data) {
      const p = data.scan_progress || {};
      const box = document.getElementById('scanProgress');
      const hasProgress = Boolean(data.running || (p.phase && p.phase !== 'idle'));
      box.classList.toggle('visible', hasProgress);
      if (!hasProgress) return;
      const percent = Math.max(0, Math.min(100, Number(p.percent) || 0));
      document.getElementById('scanProgressFill').style.width = percent + '%';
      document.getElementById('scanPercent').textContent = percent + '%';
      document.getElementById('scanProgressTrack').setAttribute('aria-valuenow', String(percent));
      const labels = {
        starting: 'بدأ الفحص...',
        'فحص حالة السوق': 'جارٍ فحص حالة السوق قبل الأسهم...',
        'تحميل الدفعة': 'جارٍ تحميل دفعة جديدة...',
        'تحميل البيانات': 'جارٍ تحميل بيانات الأسهم...',
        'تحليل الدفعة': 'جارٍ تحليل الدفعة...',
        'اكتملت الدفعة': 'اكتملت الدفعة، جارٍ الانتقال للتالية...',
        'توقف مؤقت بسبب حد Yahoo': 'توقف التحميل مؤقتاً بسبب حد Yahoo',
        completed: 'انتهى الفحص بنجاح',
        stopped: 'تم إيقاف الفحص',
        error: 'انتهى الفحص مع وجود خطأ'
      };
      document.getElementById('scanMessage').textContent = labels[p.phase] || (data.running ? 'الفحص جارٍ...' : 'انتهى الفحص');
      const total = Number(p.total) || 0;
      const completed = Number(p.completed) || 0;
      const symbolTotal = Math.floor(total / 2);
      const downloaded = Math.min(symbolTotal, completed);
      const analyzed = Math.max(0, Math.min(symbolTotal, completed - symbolTotal));
      let details = total
        ? 'تحميل البيانات: ' + downloaded + '/' + symbolTotal + ' — تحليل الأسهم: ' + analyzed + '/' + symbolTotal + ' — الدفعة ' + (p.batch || 1)
        : '';
      if (p.batch_total) details += ' — إجمالي الدفعات: ' + p.batch_total;
      if (p.current_symbol) details += (details ? ' — ' : '') + 'السهم: ' + p.current_symbol;
      if (p.error) details += (details ? '\n' : '') + 'خطأ: ' + p.error;
      document.getElementById('scanDetails').textContent = details;
      const errors = Array.isArray(data.scan_errors) ? data.scan_errors : [];
      document.getElementById('scanErrors').textContent = errors.slice(-5).map(e => e.symbol + ' [' + e.phase + ']: ' + e.message).join('\n');
    }

    async function deleteCard(event, sym) {
      event.stopPropagation();
      openCards.delete(sym);
      await fetch(`/api/cards/${encodeURIComponent(sym)}`, { method: 'DELETE' });
    }

    function toggleCard(sym) {
      if (openCards.has(sym)) {
        openCards.delete(sym);
      } else {
        openCards.add(sym);
      }
      const el = document.querySelector(`[data-symbol="${CSS.escape(sym)}"]`);
      if (el) { el.classList.toggle('is-open', openCards.has(sym)); el.querySelector('.card-header').setAttribute('aria-expanded', String(openCards.has(sym))); }
    }

    function ensureCardElement(container, sym) {
      let el = container.querySelector(`[data-symbol="${CSS.escape(sym)}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'card';
        el.dataset.symbol = sym;
        el.innerHTML = `
          <div class="card-header" role="button" tabindex="0" aria-expanded="false">
            <div class="symbol"></div>
            <div class="price-block">
              <span class="price-label">السعر</span><span class="price-text"></span><span class="price-sub"></span>
            </div>
            <div class="status-wrap"><span class="header-label">الحالة</span><span class="status-badge"></span></div>
            <div class="stage-wrap"><span class="header-label">المرحلة</span><span class="stage-badge"></span></div>
            <button class="btn-del" type="button" aria-label="حذف البطاقة" title="حذف">♜</button>
          </div>
          <div class="trade-plan">
            <h3 class="trade-plan-title">خطة التداول</h3>
            <table class="levels-table" aria-label="خطة التداول">
              <thead><tr><th class="row-index">#</th><th class="entry-head">الدخول</th><th class="target-head">الأهداف</th></tr></thead>
              <tbody class="levels-rows"></tbody>
            </table>
            <div class="stop-loss-summary"><span class="stop-loss-label">وقف الخسارة</span><strong class="stop-loss-value">—</strong></div>
          </div>
          <div class="expanded">
            <div class="section-title">أولاً: القراءة الذكية</div>
            <div class="meta smart-text"></div>
            <div class="section-title">ثانياً: الفلاتر</div>
            <div class="filters-list"></div>
          </div>
        `;
        el.addEventListener('click', (event) => { if (!event.target.closest('.btn-del')) toggleCard(sym); });
        el.querySelector('.card-header').addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleCard(sym); }
        });
        el.querySelector('.btn-del').addEventListener('click', (e) => deleteCard(e, sym));
        container.appendChild(el);
      }
      return el;
    }

    function renderCards(cards) {
      const container = document.getElementById('cardsContainer');
      const seen = new Set();

      for (const c of cards) {
        seen.add(c.symbol);
        const el = ensureCardElement(container, c.symbol);
        el.classList.toggle('is-open', openCards.has(c.symbol));
        el.querySelector('.card-header').setAttribute('aria-expanded', String(openCards.has(c.symbol)));

        el.querySelector('.symbol').textContent = c.symbol;
        const parseQuoteDate = (value) => {
          if (value === null || value === undefined || value === '') return null;
          const raw = String(value);
          const parsed = new Date((typeof value === 'number' || /^\d+(\.\d+)?$/.test(raw)) ? Number(value) * 1000 : value);
          return Number.isNaN(parsed.getTime()) ? null : parsed;
        };
        const quoteDate = parseQuoteDate(c.price_timestamp);
        const receivedDate = parseQuoteDate(c.price_received_at);
        const priceUpdated = quoteDate
          ? quoteDate.toLocaleString('ar-SA', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' })
          : (receivedDate ? receivedDate.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '');
        const receivedUpdated = quoteDate && receivedDate
          ? receivedDate.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
          : '';
        const quoteAgeSeconds = quoteDate ? Math.max(0, (Date.now() - quoteDate.getTime()) / 1000) : null;
        const freshnessLimit = c.price_session === 'regular' ? 300 : 900;
        const isStaleQuote = quoteAgeSeconds !== null && quoteAgeSeconds > freshnessLimit;
        el.querySelector('.price-text').textContent = c.current_price == null ? '—' : String(c.current_price);
        const isLivePrice = c.price_source === 'Longbridge WebSocket';
        const sourceLabel = isLivePrice
          ? (isStaleQuote ? 'آخر سعر قديم من Longbridge' : 'آخر سعر من Longbridge')
          : 'إغلاق يومي محفوظ';
        const tagLabel = Number(c.price_tag) === 1 ? 'بيانات معدّلة بعد الإغلاق' : '';
        el.querySelector('.price-sub').textContent = [
          sourceLabel,
          isLivePrice ? (c.price_session || 'regular') : '',
          priceUpdated ? (quoteDate ? 'وقت السعر ' : 'وقت الاستلام ') + priceUpdated : '',
          receivedUpdated ? 'وصل ' + receivedUpdated : '',
          tagLabel
        ].filter(Boolean).join(' • ');
        const status = el.querySelector('.status-badge');
        status.textContent = c.entry_ready ? 'جاهز' : (c.setup_passed && !c.entry_confirmation_passed ? 'انتظار التأكيد' : (c.setup_passed && !c.market_favorable ? 'السوق غير مناسب' : 'مراقبة'));
        status.classList.toggle('ready', Boolean(c.entry_ready));
        el.querySelector('.stage-badge').textContent = String(c.stage || 'تجميع بانتظار النموذج').replace(/^المرحلة\s*\d+\s*:\s*/, '');
        const entries = Array.isArray(c.entry_zones) ? c.entry_zones : [];
        const targets = Array.isArray(c.targets) ? c.targets : [];
        const rows = el.querySelector('.levels-rows');
        rows.replaceChildren();
        for (let i = 0; i < 5; i++) {
          const tr = document.createElement('tr');
          const index = document.createElement('td'); index.className = 'row-index'; index.textContent = String(i + 1);
          const entry = document.createElement('td'); entry.className = 'entry-cell'; entry.textContent = entries[i] == null ? '—' : String(entries[i]);
          const target = document.createElement('td'); target.className = 'target-cell'; target.textContent = targets[i] == null ? '—' : String(targets[i]);
          tr.append(index, entry, target);
          rows.appendChild(tr);
        }
        const stopValue = el.querySelector('.stop-loss-value');
        stopValue.textContent = c.shared_stop_loss == null ? (c.levels_status || 'غير متوفر') : String(c.shared_stop_loss);
        el.querySelector('.smart-text').textContent = c.smart_reading || '';

        const filtersNode = el.querySelector('.filters-list');
        filtersNode.replaceChildren();
        for (const f of (Array.isArray(c.filters) ? c.filters : [])) {
          const row = document.createElement('div');
          row.className = 'filter-row';
          const name = document.createElement('span');
          name.textContent = f && f.name != null ? String(f.name) : '';
          const status = document.createElement('span');
          status.textContent = f && f.pending ? 'بانتظار النموذج' : (f && f.passed ? 'ناجح' : 'غير ناجح');
          row.append(name, status);
          filtersNode.appendChild(row);
        }
      }

      for (const existing of Array.from(container.children)) {
        if (!seen.has(existing.dataset.symbol)) {
          existing.remove();
        }
      }
    }

    function applySnapshot(data) {
      if (!data || typeof data !== 'object' || !Number.isFinite(Number(data.version))) {
        console.warn('[MINERVINI] Ignored invalid state snapshot', data);
        return;
      }
      const snapshotVersion = Number(data.version);
      if (snapshotVersion <= lastAppliedSnapshotVersion) {
        console.debug('[MINERVINI] Ignored stale state snapshot', {
          received: snapshotVersion, latest: lastAppliedSnapshotVersion
        });
        return;
      }
      lastAppliedSnapshotVersion = snapshotVersion;

      const sessionEl = document.getElementById('marketSession');
      if (data.last_error) {
        sessionEl.textContent = `خطأ: ${data.last_error}`;
      } else {
        sessionEl.textContent = `حالة السوق: ${data.market_session || 'قبل الافتتاح'}`;
      }
      renderScanProgress(data);

      // A missing cards field is an incomplete payload, not an instruction to
      // erase the watchlist. An explicit empty array remains authoritative.
      if (!Array.isArray(data.cards)) {
        console.warn('[MINERVINI] Snapshot omitted cards; preserving rendered watchlist', snapshotVersion);
        return;
      }
      if (lastRenderedCardCount > 0 && data.cards.length === 0) {
        console.warn('[MINERVINI] Server sent an empty watchlist snapshot', {
          version: snapshotVersion, running: data.running,
          scanProgress: data.scan_progress
        });
      }
      renderCards(data.cards);
      lastRenderedCardCount = data.cards.length;
    }

    function connectRealtimeStream() {
      const evtSource = new EventSource('/api/stream');
      evtSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          applySnapshot(data);
        } catch (e) {
          console.error('[MINERVINI] SSE message parse failed', e);
        }
      };
      evtSource.onerror = (e) => {
        console.error('[MINERVINI] SSE connection error', e);
        evtSource.close();
        // The server's in-memory snapshot version restarts from zero after a
        // Render/Gunicorn restart. Reset the client cursor before reconnecting,
        // otherwise every fresh snapshot can be rejected as "older" forever.
        lastAppliedSnapshotVersion = -1;
        setTimeout(connectRealtimeStream, 2000);
      };
    }

    fetch('/api/state', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data) applySnapshot(data); })
      .catch((e) => console.error('[MINERVINI] Initial state request failed', e));

    connectRealtimeStream();
  </script>
</body>
</html>
